[libraries]
assertj-core = { group = "org.assertj", name = "assertj-core", version = "3.27.7" }
archunit = { group = "com.tngtech.archunit", name = "archunit", version = "1.5.0" }
camel-quarkus-jackson = { group = "org.apache.camel.quarkus", name = "camel-quarkus-jackson", version = "3.39.0" }
commons-vfs2 = { group = "org.apache.commons", name = "commons-vfs2", version = "2.10.0" }
graal = { group = "org.graalvm.nativeimage", name = "svm", version = "25.0.4.1" }
mapstruct = { group = "org.mapstruct", name = "mapstruct", version = "1.6.3" }
mapstruct-processor = { group = "org.mapstruct", name = "mapstruct-processor", version = "1.6.3" }
mongock-bom = { group = "io.mongock", name = "mongock-bom", version = "5.5.1" }
jboss-vfs = { group = "org.jboss", name = "jboss-vfs", version = "3.3.2.Final" }
quarkus-resteasy-problem = { group = "io.quarkiverse.resteasy-problem", name = "quarkus-resteasy-problem", version = "3.32.1" }
wiremock = { group = "com.github.tomakehurst", name = "wiremock-jre8", version = "3.0.1" }
testcontainers-keycloak = { group = "com.github.dasniko", name = "testcontainers-keycloak", version = "4.3.1" }
checkstyle = { module = "com.puppycrawl.tools:checkstyle", version = "14.0.0" }
quarkus-bom = { group = "io.quarkus.platform", name = "quarkus-bom", version = "3.38.3" }
swagger-annotations = { group = "io.swagger", name = "swagger-annotations", version = "1.6.16" }

[plugins]
gradle-git-properties = { id = "com.gorylenko.gradle-git-properties", version = "4.0.1" }
gradle-node = { id = "com.github.node-gradle.node", version = "7.1.0" }
liquibase = { id = "org.liquibase.gradle", version = "3.1.0" }
liquibase_core = { group = 'org.liquibase', id = "liquibase-core", version = "4.27.0" }
sonarqube = { id = "org.sonarqube", version = "7.4.0.8496" }
openapi-generator = { id = "org.openapi.generator", version = "7.25.0" }
no-http-checkstyle = { id = "io.github.checkstyle.checkstyle", version = "0.0.11" }
gradle-modernizer-plugin = { id = 'com.github.andygoossens.gradle-modernizer-plugin', version = '1.15.0' }
